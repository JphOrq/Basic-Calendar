<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <title>Philippine Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Screenshot_calendar.png" type="image/x-icon" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="calendar-container">
        <header class="calendar-header">
            <div class="header-brand">
                <span class="material-symbols-rounded">calendar_today</span>
                <h1>Philippine <span class="accent">Calendar</span></h1>
            </div>
            <div class="header-controls">
                <select id="year-dropdown"></select>
                <button id="export-pdf" title="Export as PDF">
                    <span class="material-symbols-rounded">picture_as_pdf</span> Export PDF
                </button>
            </div>
        </header>
        <div class="all-months" id="all-months"></div>
    </div>
    <br />
    <footer class="main-footer reveal">
        <p>
            JphOrq
            <a href="https://github.com/JphOrq" target="_blank">
                <img id="github-icon" src="GitHub1.png" alt="GitHub" width="24" height="24" />
            </a>
            <br />
            &copy; 2023-<span id="currentYear"></span>
        </p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
